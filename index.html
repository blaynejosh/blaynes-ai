<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="B.L.A.Y.N.E AI — Business Leading Agent Yielding Next-Gen Enterprise Strategies. Your consulting team, on demand."
    />
    <title>B.L.A.Y.N.E AI — Your consulting team, on demand</title>
    <script>
      // Dark is the default (see index.css); this only has to act early
      // for a returning visitor who previously chose light, so there's no
      // flash of dark before ThemeProvider mounts and takes over.
      try {
        var t = localStorage.getItem('blayne-theme');
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
